{% extends "layout.html" %}

{% block content %}

<div class="card shadow-sm p-4 mx-auto" style="max-width:600px;">

<h4 class="mb-4">
<i class="bi bi-gear-fill me-2"></i>
Expense Preferences
</h4>

<form method="POST">

<!-- Currency -->
<div class="mb-3">
<label class="form-label">Default Currency</label>
<select name="currency" class="form-select">

  
  {% set symbols = {"INR":"₹","USD":"$","GBP":"£","EUR":"€"} %}

  {% for cur in currencies %}
    <option value="{{ cur }}"
      {% if prefs and prefs.default_currency == cur %}selected{% endif %}>
      
      
      {{ symbols.get(cur, "") }} {{ cur }}

    </option>
  {% endfor %}

</select>
</div>


<div class="mb-3">
  <label class="form-label">Budget Alert</label>

  <select name="alert_threshold" class="form-select">
    <option value="80" {% if prefs and prefs.alert_threshold == 80 %}selected{% endif %}>
      80% (Warning)
    </option>

    <option value="90" {% if prefs and prefs.alert_threshold == 90 %}selected{% endif %}>
      90% (Critical)
    </option>

    <option value="100" {% if prefs and prefs.alert_threshold == 100 %}selected{% endif %}>
      100% (Limit)
    </option>

    <option value="0" {% if prefs and prefs.alert_threshold == 0 %}selected{% endif %}>
      Disable Alerts
    </option>
  </select>
</div>



<div class="mb-3">
  <label class="form-label">Show Notes Column</label>
  <select name="show_notes" class="form-select">
    <option value="yes" selected>Yes</option>
    <option value="no">No</option>
  </select>
</div>


<div class="text-center">
<button type="submit" class="btn btn-primary w-40">
Save Preferences
</button>
</div>

</form>

</div>

{% endblock %}
