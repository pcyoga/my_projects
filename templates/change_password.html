{% extends "layout.html" %}
{% block content %}

<div class="password-page">

  <div class="password-card">

    <!-- Left Info Panel -->
    <div class="password-info">
      <h2>🔐 Security Settings</h2>
      <p>Keep your account safe by updating your password regularly.</p>

      <ul>
        <li>✔ Minimum 8 characters</li>
        <li>✔ Include uppercase & number</li>
        <li>✔ Avoid reusing old passwords</li>
      </ul>
    </div>

    <!-- Right Form Panel -->
    <div class="password-form-section">

      <h3>Change Password</h3>

      <!-- FORM -->
      <form id="changePasswordForm">

        <!-- Current -->
        <div class="form-floating mb-3">
          <input type="password" name="current_password" class="form-control input-modern" id="currentPassword" placeholder="Current Password" required>
          <label>Current Password</label>
        </div>

        <!-- New -->
        <div class="form-floating mb-3">
          <input type="password" name="new_password" class="form-control input-modern" id="newPassword" placeholder="New Password" required>
          <label>New Password</label>
        </div>

        <!-- Confirm -->
        <div class="form-floating mb-3">
          <input type="password" name="confirm_password" class="form-control input-modern" id="confirmPassword" placeholder="Confirm Password" required>
          <label>Confirm Password</label>
        </div>

        <!-- Strength -->
        <div class="strength-wrapper">
          <div id="strengthBar"></div>
        </div>

        <!-- Button -->
        <button type="submit" class="btn btn-modern w-100">
          Update Password
        </button>

      </form>

      <!-- POPUP -->
      <div id="popupMessage" class="popup"></div>

    </div>

  </div>

</div>

<!-- JS -->
<script>

// Strength Bar
const passwordInput = document.getElementById("newPassword");
const strengthBar = document.getElementById("strengthBar");

passwordInput.addEventListener("input", () => {
  let val = passwordInput.value;
  let strength = 0;

  if (val.length >= 8) strength++;
  if (/[A-Z]/.test(val)) strength++;
  if (/[0-9]/.test(val)) strength++;
  if (/[@$!%*?&]/.test(val)) strength++;

  const width = strength * 25;
  strengthBar.style.width = width + "%";

  if (width <= 25) strengthBar.style.background = "#ff4d4d";
  else if (width <= 50) strengthBar.style.background = "#ffa500";
  else if (width <= 75) strengthBar.style.background = "#2ecc71";
  else strengthBar.style.background = "#27ae60";
});


// FORM SUBMIT (NO RELOAD)
document.getElementById("changePasswordForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    fetch("/change_password", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {

        const popup = document.getElementById("popupMessage");

        popup.innerText = data.message;
        popup.className = "popup " + data.status;
        popup.className = "popup " + data.status + " show";

        setTimeout(() => {
            popup.classList.remove("show");
        }, 3000);

        if (data.status === "success") {
            this.reset();
            strengthBar.style.width = "0%";
        }

    })
    .catch(() => {
        alert("Something went wrong");
    });
});

</script>

{% endblock %}
