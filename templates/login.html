{% extends "layout.html" %}

{% block body_class %}login-bg{% endblock %}

{% block content %}

<img src="{{ url_for('static', filename='images/logo.png') }}" class="app-logo">

<div class="center-container">
  <div class="card p-4" style="width: 400px;">
    <h2 class="text-center mb-4">Login</h2>



    <form method="post" action="{{ url_for('login') }}">

      <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" required class="form-control" placeholder="Enter your email">
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input type="password" name="password" required class="form-control" placeholder="Enter your password">
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Login</button>
      </div>

    </form>

    <p class="text-center mt-3">
      Don’t have an account?
      <a href="{{ url_for('signup') }}">SignUp here</a>
    </p>

  </div>
</div>

{% endblock %}
